# nginx reverse proxy (use this OR Caddy).  /etc/nginx/sites-available/bioattend.conf
# Certificates: e.g. `certbot --nginx -d attendance.example.com`, or your company certificate.
server {
    listen 80;
    server_name attendance.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name attendance.example.com;

    ssl_certificate     /etc/letsencrypt/live/attendance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.example.com/privkey.pem;

    client_max_body_size 2G;      # backup uploads for restore
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
