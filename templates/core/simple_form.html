{% extends "base.html" %}
{% block title %}{{ crud.title }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">{% if object %}Edit {{ object }}{% else %}New {{ crud.title|slice:":-1"|lower }}{% endif %}</h1>
  <div class="actions"><a class="btn btn-light" href="{% url crud.list_name %}"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
</div>
<div class="card" style="max-width:820px"><div class="card-body">
<form method="post">{% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="mt-4"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Save</button></div>
</form></div></div>
{% endblock %}
