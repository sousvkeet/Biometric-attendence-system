{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1 class="page-title">Change password</h1></div>
<div class="card" style="max-width:480px"><div class="card-body">
<form method="post">{% csrf_token %}
  {% for field in form %}
  <div class="mb-3"><label class="form-label">{{ field.label }}</label>
    <input type="password" name="{{ field.html_name }}" class="form-control {% if field.errors %}is-invalid{% endif %}" required>
    {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}</div>
  {% endfor %}
  <button class="btn btn-primary">Change password</button>
</form></div></div>
{% endblock %}
