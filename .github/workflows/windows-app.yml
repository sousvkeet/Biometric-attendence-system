# Builds BioAttend for Windows on a clean GitHub-hosted Windows machine (manual: Actions tab -> "Run workflow").
# These builds are signed with a throwaway certificate created on the runner, for testing only; official release
# files are signed with the company certificate (see docs/WINDOWS_APP.md -> "Digital signature").
name: Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the test suite
        shell: pwsh
        env:
          SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz
          LOG_TO_FILE: "false"
        run: |
          python -m pip install -r requirements.txt
          python manage.py test

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          powershell -ExecutionPolicy Bypass -File desktop\build_windows.ps1 -Python (Get-Command python).Source -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: BioAttend-Windows
          path: |
            dist/BioAttend-*.msi
            dist/BioAttend-Setup-*.exe
            dist/BioAttend-portable-*.zip
            dist/build.log
