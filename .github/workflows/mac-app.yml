# Builds BioAttend for macOS (Apple Silicon and Intel) on GitHub-hosted Macs: .dmg + .zip per architecture.
# Runs on every push to the "mac-app" branch, or manually (Actions tab -> "Run workflow").
name: macOS app

on:
  push:
    branches: [mac-app]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (empty: APP_VERSION from desktop/bioattend_desktop.py)"
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple Silicon (arm64), Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the test suite
        env:
          SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz
          LOG_TO_FILE: "false"
        run: |
          python -m pip install -q -r requirements.txt
          python manage.py test

      - name: Build, test and package the app
        env:
          BIOATTEND_WINDOW_TEST: "1"
        run: PYTHON="$(which python)" desktop/build_macos.sh ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BioAttend-macOS-${{ runner.arch }}
          path: dist/macos/*
